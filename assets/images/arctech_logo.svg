<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 155" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 78px;
        letter-spacing: -1px;
      }
      .brand-subtitle {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 9px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Architectural Tower Icon on Left -->
  <g id="tower-icon" transform="translate(10, 8)">
    <!-- Top Roof Cap -->
    <path d="M 50 10 L 80 28 L 80 50 L 50 32 Z" fill="#152238" />
    <path d="M 20 28 L 50 10 L 50 32 L 20 50 Z" fill="#0c1424" />
    
    <!-- Middle Tier -->
    <path d="M 50 44 L 92 69 L 92 90 L 50 64 Z" fill="#152238" />
    <path d="M 8 69 L 50 44 L 50 64 L 8 90 Z" fill="#0c1424" />
    
    <!-- Bottom Base Tier -->
    <path d="M 50 76 L 100 106 L 100 130 L 50 99 Z" fill="#152238" />
    <path d="M 0 106 L 50 76 L 50 99 L 0 130 Z" fill="#0c1424" />

    <!-- Cyan Architectural Accent Spine -->
    <path d="M 78 98 L 91 106 L 91 130 L 78 122 Z" fill="#00a8b5" />
    <path d="M 78 59 L 91 67 L 91 80 L 78 72 Z" fill="#00a8b5" />
  </g>

  <!-- Brand Typography -->
  <!-- "Arc" in Navy (#152238) and "tech" in Cyan (#00a8b5) -->
  <text x="124" y="98" class="brand-title">
    <tspan fill="#152238">Arc</tspan><tspan fill="#00a8b5">tech</tspan>
  </text>

  <!-- Subtitle: PROJECTS with accent rules aligned under Arctech -->
  <line x1="126" y1="126" x2="195" y2="126" stroke="#00a8b5" stroke-width="2.5" stroke-linecap="round" />
  <text x="296" y="132" class="brand-subtitle" fill="#152238">PROJECTS</text>
  <line x1="392" y1="126" x2="462" y2="126" stroke="#00a8b5" stroke-width="2.5" stroke-linecap="round" />
</svg>
